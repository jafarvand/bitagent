<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Marketing Growth Agent operating model</title>
  <desc id="desc">A controlled seven-stage marketing loop serving new-customer acquisition and existing-user retention, surrounded by approval, consent, measurement, and audit guardrails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b25"/>
      <stop offset="1" stop-color="#102f36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee6b8"/>
      <stop offset="1" stop-color="#30b7d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee6b8"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.muted{fill:#a9c0c6}.white{fill:#f7fbfa}.card{fill:#12343c;stroke:#2c5961;stroke-width:1.5}.small{font-size:17px}.label{font-size:16px;font-weight:700;letter-spacing:.12em}.stage{font-size:22px;font-weight:800}.body{font-size:18px}.metric{font-size:16px;font-weight:650}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="80" r="210" fill="#1a5560" opacity=".28"/>
  <circle cx="70" cy="850" r="260" fill="#0b765f" opacity=".16"/>

  <g class="sans">
    <text x="80" y="82" class="label" fill="#5ee6b8">BITAGENT · GROWTH OPERATING SYSTEM</text>
    <text x="80" y="135" class="white" font-size="44" font-weight="850">Marketing Growth Agent</text>
    <text x="80" y="174" class="muted" font-size="21">Disciplined acquisition + retention plans, governed automation, measurable learning.</text>

    <g filter="url(#shadow)">
      <rect x="80" y="220" width="390" height="185" rx="24" class="card"/>
      <rect x="100" y="242" width="54" height="54" rx="16" fill="#5ee6b8"/>
      <path d="M117 277c9-22 18-22 27 0M120 265h21" fill="none" stroke="#08242b" stroke-width="4" stroke-linecap="round"/>
      <text x="174" y="264" class="label" fill="#5ee6b8">NEW CUSTOMERS</text>
      <text x="174" y="295" class="stage white">Acquisition discipline</text>
      <text x="110" y="337" class="body muted">Audience → awareness → registration</text>
      <text x="110" y="367" class="body muted">→ activation → early retention</text>
      <text x="110" y="392" class="metric" fill="#f5cc6a">KPIs · CAC · activation · payback</text>

      <rect x="970" y="220" width="390" height="185" rx="24" class="card"/>
      <rect x="990" y="242" width="54" height="54" rx="16" fill="#30b7d4"/>
      <path d="M1007 271a11 11 0 1 0 18-9M1027 258v11h-11" fill="none" stroke="#08242b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1064" y="264" class="label" fill="#68d8ec">EXISTING USERS</text>
      <text x="1064" y="295" class="stage white">Retention discipline</text>
      <text x="1000" y="337" class="body muted">Onboard → adopt → engage → retain</text>
      <text x="1000" y="367" class="body muted">→ re-engage → learn</text>
      <text x="1000" y="392" class="metric" fill="#f5cc6a">KPIs · adoption · churn · LTV</text>
    </g>

    <g transform="translate(720 465)">
      <circle r="148" fill="#0c2931" stroke="#397079" stroke-width="2"/>
      <circle r="112" fill="url(#accent)" opacity=".12"/>
      <circle r="76" fill="url(#accent)"/>
      <path d="M-25 7h50M-17-10h34M-10-27h20" stroke="#08242b" stroke-width="7" stroke-linecap="round"/>
      <path d="M-33 28c22 18 44 18 66 0" fill="none" stroke="#08242b" stroke-width="7" stroke-linecap="round"/>
      <text y="120" text-anchor="middle" class="label white">EVIDENCE-LED GROWTH</text>
    </g>

    <g fill="none" stroke="#5ee6b8" stroke-width="3" marker-end="url(#arrow)" opacity=".9">
      <path d="M470 310 C560 310 570 360 605 390"/>
      <path d="M835 390 C870 360 880 310 970 310"/>
    </g>

    <g filter="url(#shadow)">
      <g transform="translate(82 470)"><rect width="210" height="108" rx="18" class="card"/><text x="22" y="35" class="label" fill="#5ee6b8">01 · OBSERVE</text><text x="22" y="70" class="small muted">Consent, signals,</text><text x="22" y="94" class="small muted">history, freshness</text></g>
      <g transform="translate(320 610)"><rect width="210" height="108" rx="18" class="card"/><text x="22" y="35" class="label" fill="#5ee6b8">02 · PLAN</text><text x="22" y="70" class="small muted">Goal, segment, KPI,</text><text x="22" y="94" class="small muted">budget, stop rule</text></g>
      <g transform="translate(556 720)"><rect width="210" height="108" rx="18" class="card"/><text x="22" y="35" class="label" fill="#5ee6b8">03 · CREATE</text><text x="22" y="70" class="small muted">Brief, variants,</text><text x="22" y="94" class="small muted">calendar, tracking</text></g>
      <g transform="translate(794 720)"><rect width="210" height="108" rx="18" class="card"/><text x="22" y="35" class="label" fill="#f5cc6a">04 · APPROVE</text><text x="22" y="70" class="small muted">Human checks exact</text><text x="22" y="94" class="small muted">campaign parameters</text></g>
      <g transform="translate(1030 610)"><rect width="210" height="108" rx="18" class="card"/><text x="22" y="35" class="label" fill="#5ee6b8">05 · EXECUTE</text><text x="22" y="70" class="small muted">Scoped schedule,</text><text x="22" y="94" class="small muted">limits, kill switch</text></g>
      <g transform="translate(1148 470)"><rect width="210" height="108" rx="18" class="card"/><text x="22" y="35" class="label" fill="#5ee6b8">06 · MEASURE</text><text x="22" y="70" class="small muted">Conversion, retention,</text><text x="22" y="94" class="small muted">spend, complaints</text></g>
      <g transform="translate(615 245)"><rect width="210" height="108" rx="18" class="card"/><text x="22" y="35" class="label" fill="#5ee6b8">07 · LEARN</text><text x="22" y="70" class="small muted">Keep, change, stop;</text><text x="22" y="94" class="small muted">record evidence</text></g>
    </g>

    <g fill="none" stroke="#426d74" stroke-width="2" stroke-dasharray="5 7">
      <path d="M292 525 Q375 535 425 610"/><path d="M530 665 Q585 700 625 720"/><path d="M766 774 H794"/><path d="M1004 742 Q1040 700 1070 718"/><path d="M1240 610 Q1260 585 1255 578"/>
    </g>

    <rect x="80" y="852" width="1280" height="2" fill="#2c5961"/>
    <text x="80" y="881" class="small muted">GUARDRAILS</text>
    <text x="235" y="881" class="metric white">Consent · Privacy · Brand · Compliance · Frequency caps · Human approval · Audit</text>
    <text x="1360" y="881" text-anchor="end" class="small" fill="#f5cc6a">No autonomous spend or external send</text>
  </g>
</svg>
