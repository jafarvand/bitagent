services:
  bitagent:
    build: .
    ports:
      - "8999:8999"
    environment:
      VIRTUAL_HOST: bitagent.zekabot.com
      VIRTUAL_PORT: "8999"
      LETSENCRYPT_HOST: bitagent.zekabot.com
    env_file:
      - path: .env
        required: false
    networks:
      - default
      - nginx-proxy
    restart: unless-stopped

networks:
  nginx-proxy:
    external: true
