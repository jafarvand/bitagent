name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q

  production-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag bitagent:ci .
      - run: docker run --detach --name bitagent-ci --publish 8999:8999 bitagent:ci
      - name: Wait for the production image
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8999/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs bitagent-ci
          exit 1
      - name: Verify deployed UI assets and API
        run: |
          curl --fail --silent http://127.0.0.1:8999/ | grep --quiet 'id="freshness-summary"'
          curl --fail --silent http://127.0.0.1:8999/ | grep --quiet 'app.js?v=3.0.0-rc.4'
          curl --fail --silent http://127.0.0.1:8999/api/v0/agents | grep --quiet 'market-risk'
          curl --fail --silent http://127.0.0.1:8999/agents/operations | grep --quiet 'agent-chat.js?v=3.0.0-rc.4-agents'
          curl --fail --silent http://127.0.0.1:8999/knowledge | grep --quiet 'knowledge.js?v=3.0.0-rc.4-knowledge'
          curl --fail --silent http://127.0.0.1:8999/delivery | grep --quiet 'delivery.js?v=3.0.0-rc.4-delivery'
          curl --fail --silent http://127.0.0.1:8999/pilot-readiness | grep --quiet 'pilot-readiness.js?v=3.0.0-rc.4'
          curl --fail --silent http://127.0.0.1:8999/manager | grep --quiet 'manager.js?v=3.0.0-rc.4-manager'
          curl --fail --silent http://127.0.0.1:8999/static/i18n.js | grep --quiet 'bitagent-language'
          curl --fail --silent -H 'X-BitAgent-Role: operator' 'http://127.0.0.1:8999/api/v0/agents?language=fa' | grep --quiet 'عامل عملیات'
          curl --fail --silent -H 'X-BitAgent-Role: operator' 'http://127.0.0.1:8999/api/v0/management/questions?language=fa' | grep --quiet 'MQ-20'
          curl --fail --silent -H 'X-BitAgent-Role: auditor' 'http://127.0.0.1:8999/api/v0/delivery/posture?tenant_id=ci-exchange' | grep --quiet 'external_delivery_enabled'
          curl --fail --silent -H 'X-BitAgent-Role: auditor' 'http://127.0.0.1:8999/api/v0/releases/candidate?tenant_id=ci-exchange' | grep --quiet 'controlled_actions_enabled'
          curl --fail --silent http://127.0.0.1:8999/api/v0/xima/agents/operations/source-contract | grep --quiet 'exchange_required'
          curl --fail --silent http://127.0.0.1:8999/api/v0/xima/agents/market-risk/source-contract | grep --quiet 'order-book'
          curl --fail --silent http://127.0.0.1:8999/api/v0/xima/domain-sources | grep --quiet 'privileged-activity'
          curl --fail --silent http://127.0.0.1:8999/api/v0/identity/readiness | grep --quiet 'pilot_header_allowed'
          curl --fail --silent 'http://127.0.0.1:8999/api/v0/dashboard?market=BTC_USDT&days=30' >/dev/null
          curl --fail --silent 'http://127.0.0.1:8999/api/v0/trends?limit=30' >/dev/null
          curl --fail --silent -H 'X-BitAgent-Role: operator' 'http://127.0.0.1:8999/api/v0/exchange/transaction-intelligence?limit=5' >/dev/null
          curl --fail --silent -H 'X-BitAgent-Role: operator' 'http://127.0.0.1:8999/api/v0/exchange/treasury-intelligence' >/dev/null
          curl --fail --silent -H 'X-BitAgent-Role: operator' 'http://127.0.0.1:8999/api/v0/exchange/users/1/investigation?days=7&limit=5' >/dev/null
      - if: always()
        run: docker rm --force bitagent-ci

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --requirement requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag bitagent:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bitagent:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
